
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Registration - FuelConnect Nigeria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FuelConnect Nigeria</h1>
    <h2>Supplier Registration</h2>
  </header>

  <main>
    <form id="supplierForm">
      <label for="business">Business Name</label>
      <input id="business" type="text" required>

      <label for="fullname">Contact Person's Full Name</label>
      <input id="fullname" type="text" required>

      <label for="phone">Business Phone Number</label>
      <input id="phone" type="tel" required>

      <label for="email">Business Email Address</label>
      <input id="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="8" required>

      <label for="state">State</label>
      <select id="state" required>
        <option value="">Select State</option>
        <option>Abia</option><option>Adamawa</option>
        <option>Akwa Ibom</option><option>Anambra</option>
        <option>Bauchi</option><option>Bayelsa</option>
        <option>Benue</option><option>Borno</option>
        <option>Cross River</option><option>Delta</option>
        <option>Ebonyi</option><option>Edo</option>
        <option>Ekiti</option><option>Enugu</option>
        <option>FCT</option><option>Gombe</option>
        <option>Imo</option><option>Jigawa</option>
        <option>Kaduna</option><option>Kano</option>
        <option>Katsina</option><option>Kebbi</option>
        <option>Kogi</option><option>Kwara</option>
        <option>Lagos</option><option>Nasarawa</option>
        <option>Niger</option><option>Ogun</option>
        <option>Ondo</option><option>Osun</option>
        <option>Oyo</option><option>Plateau</option>
        <option>Rivers</option><option>Sokoto</option>
        <option>Taraba</option><option>Yobe</option>
        <option>Zamfara</option>
      </select>

      <label for="products">Products Supplied</label>
      <select id="products" required>
        <option value="">Select Product</option>
        <option value="PMS">PMS</option>
        <option value="AGO">AGO</option>
        <option value="DPK">DPK</option>
        <option value="ATK">ATK</option>
        <option value="LPG">LPG</option>
        <option value="Multiple Products">Multiple Products</option>
      </select>

      <label for="licence">Licence Type or Reference</label>
      <input id="licence" type="text">

      <label for="location">Business Address / Location</label>
      <textarea id="location" required></textarea>

      <button type="submit" id="submitButton">
        Submit Supplier Registration
      </button>

      <p id="supplierMessage" role="status"></p>
    </form>

    <p>
      Supplier accounts remain pending until business details and
      applicable regulatory licences are reviewed. Registration
      does not mean licence verification or approval.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification,
      reload,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    // Replace these values with the exact config from buyer-register.html
    const firebaseConfig = {
        apiKey: "AIzaSyDzYN13ha9KSS4Q6CNn4GiegCzeNdLfI5I",
  authDomain: "fuelconnect-nigeria.firebaseapp.com",
  projectId: "fuelconnect-nigeria",
  storageBucket: "fuelconnect-nigeria.firebasestorage.app",
  messagingSenderId: "346356529363",
  appId: "1:346356529363:web:e3ba160b4dd76f1ae5fc26",
  measurementId: "G-YNT0B08YF1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("supplierForm");
    const message = document.getElementById("supplierMessage");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Please wait...";

      try {
        let user = auth.currentUser;

if (user && user.email.toLowerCase() !== email) {
  await signOut(auth);
  user = null;
}

        if (!user) {
          try {
            const credential = await createUserWithEmailAndPassword(
              auth, email, password
            );
            user = credential.user;
            await sendEmailVerification(user);

            message.textContent =
              "Verification email sent. Verify your email, then return here and submit this form again.";

            button.disabled = false;
            return;

          } catch (error) {
            if (error.code !== "auth/email-already-in-use") {
              throw error;
            }

            const credential = await signInWithEmailAndPassword(
              auth, email, password
            );
            user = credential.user;
          }
        }

        if (user.email.toLowerCase() !== email) {
          throw new Error("Please sign in with the email entered in this form.");
        }

        await reload(user);

        if (!user.emailVerified) {
          message.textContent =
            "Please verify your email first. Open the verification email, then submit this form again.";
          button.disabled = false;
          return;
        }

        await user.getIdToken(true);

        const userRef = doc(db, "users", user.uid);
        const existing = await getDoc(userRef);

        if (existing.exists()) {
          throw new Error("This account already has a registered profile.");
        }

        const supplierData = {
          business: document.getElementById("business").value.trim(),
          fullname: document.getElementById("fullname").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: user.email,
          state: document.getElementById("state").value,
          products: document.getElementById("products").value,
          licence: document.getElementById("licence").value.trim(),
          location: document.getElementById("location").value.trim(),
          role: "supplier",
          status: "pending",
          createdAt: serverTimestamp()
        };

        await setDoc(userRef, supplierData);

        message.textContent =
          "Supplier registration submitted. Your account is pending review.";

        form.reset();

      } catch (error) {
        console.error(error);
        message.textContent =
          "Registration error: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
